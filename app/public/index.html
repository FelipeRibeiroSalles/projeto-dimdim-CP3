<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Risa CP3</title>

  <style>

    body {
      font-family: Arial;
      margin: 40px;
      background: #f4f4f4;
    }

    h1 {
      color: #333;
    }

    form {
      margin-bottom: 20px;
    }

    input {
      padding: 10px;
      margin: 5px;
    }

    button {
      padding: 10px;
      cursor: pointer;
      margin: 2px;
    }

    table {
      width: 100%;
      background: white;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    .delete-btn {
      background: #d9534f;
      color: white;
      border: none;
    }

  </style>

</head>

<body>

  <h1>Clientes DimDim</h1>

  <form id="clienteForm">

    <input
      type="text"
      id="nome"
      placeholder="Nome"
      required
    >

    <input
      type="email"
      id="email"
      placeholder="Email"
      required
    >

    <input
      type="number"
      id="saldo"
      placeholder="Saldo"
      required
    >

    <button type="submit">
      Cadastrar
    </button>

  </form>

  <table>

    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Email</th>
        <th>Saldo</th>
        <th>Ações</th>
      </tr>
    </thead>

    <tbody id="clientesTable"></tbody>

  </table>

<script>

async function carregarClientes() {

  const response = await fetch('/clientes');

  const clientes = await response.json();

  const tabela = document.getElementById('clientesTable');

  tabela.innerHTML = '';

  clientes.forEach(cliente => {

    tabela.innerHTML += `
      <tr>

        <td>${cliente.id}</td>

        <td>${cliente.nome}</td>

        <td>${cliente.email}</td>

        <td>${cliente.saldo}</td>

        <td>

          <button
            class="delete-btn"
            onclick="deletarCliente(${cliente.id})"
          >
            Excluir
          </button>

        </td>

      </tr>
    `;
  });
}

document.getElementById('clienteForm')
.addEventListener('submit', async (e) => {

  e.preventDefault();

  const nome = document.getElementById('nome').value;

  const email = document.getElementById('email').value;

  const saldo = document.getElementById('saldo').value;

  await fetch('/clientes', {

    method: 'POST',

    headers: {
      'Content-Type': 'application/json'
    },

    body: JSON.stringify({
      nome,
      email,
      saldo
    })

  });

  carregarClientes();

  document.getElementById('clienteForm').reset();

});

async function deletarCliente(id) {

  await fetch('/clientes/' + id, {
    method: 'DELETE'
  });

  carregarClientes();
}

carregarClientes();

</script>

</body>
</html>
